<section class="historial-section">
  <!-- Contenedor Principal - Historial de  solicitudes-->
  <div class="historial-card">
    <div class="card-header">
      <div class="header-text-group">
        <h3 class="card-title">Historial de Solicitudes</h3>
      </div>

      <div class="header-badge-group">
        <!-- Conteo de Solicitudes -->
        <span class="count-badge">{{ solicitudes().length }} Solicitudes</span>
      </div>
    </div>

    <!-- Tabla de Solicitudes Académicas -->
    <div class="table-responsive">
      <table class="solicitudes-table">
        <thead>
          <tr>
            <th class="col-radicado">CÓDIGO SOLICITUD</th>
            <th class="col-tramite">TRÁMITE ACADÉMICO</th>
            <th class="col-alumno">CÓDIGO ALUMNO</th>
            <th class="col-fecha">FECHA RADICACIÓN</th>
            <th class="col-estado">ESTADO</th>
            <th class="col-detalle">DETALLE</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let solicitud of solicitudes()" class="table-row">
            <!-- 1. Código Radicado -->
            <td class="col-radicado">
              <div class="radicado-cell">
                <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                  <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span class="radicado-text">{{ solicitud.codigoRadicado }}</span>
              </div>
            </td>

            <!-- 2. Trámite Académico -->
            <td class="col-tramite">
              <div class="tramite-cell">
                <span class="tramite-title">{{ solicitud.tipoTramite }}</span>
              </div>
            </td>

            <!-- 3. Código del Alumno Solicitante -->
            <td class="col-alumno">
              <div class="alumno-cell">
                <span class="alumno-icon-wrapper">
                  <svg class="alumno-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                    <circle cx="9" cy="10" r="2"></circle>
                    <line x1="15" y1="8" x2="17" y2="8"></line>
                    <line x1="15" y1="12" x2="17" y2="12"></line>
                    <line x1="7" y1="16" x2="17" y2="16"></line>
                  </svg>
                </span>
                <div class="alumno-info">
                  <span class="alumno-codigo">{{ solicitud.estudiante.codigo }}</span>
                </div>
              </div>
            </td>

            <!-- 4. Fecha de Radicación -->
            <td class="col-fecha">
              <span class="fecha-text">{{ solicitud.fechaRadicacion }}</span>
            </td>

            <!-- 5. Estado con Directiva Personalizada StatusBadge -->
            <td class="col-estado">
              <div class="status-pill" [appStatusBadge]="solicitud.estado">
                <span class="status-dot"></span>
                <span class="status-text">{{ solicitud.estado }}</span>
              </div>
            </td>

            <!-- 6. Detalle (Acción interactiva para modal) -->
            <td class="col-detalle">
              <button type="button" class="detail-action-btn" (click)="abrirDetalle(solicitud)"
                title="Ver detalle completo de {{ solicitud.codigoRadicado }}">
                Ver más
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Paginación en Pie de Tarjeta -->
    <div class="card-pagination">
      <div class="pagination-controls">
        <button type="button" class="page-arrow-btn" title="Página anterior">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <button type="button" class="page-number-btn active">
          1
        </button>

        <button type="button" class="page-arrow-btn" title="Página siguiente">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>

<!-- Modal de Detalle de Solicitud -->
<app-solicitud-detalle-modal [solicitud]="solicitudSeleccionada()"
  (cerrar)="cerrarDetalle()"></app-solicitud-detalle-modal>
